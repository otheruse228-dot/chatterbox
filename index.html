<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="robots" content="noindex">
<title>Chatterbox – Watch together</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #player, iframe, video { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #000; }
  /* YouTube only. The app draws its own controls and keeps everybody in sync,
     so a click on the video itself (which would pause only one side) is caught
     by these two transparent shields. The bottom-right corner stays open on
     purpose (YouTube's "Skip ad" button), and while an ad plays the app takes
     the shields away completely (cbx.shields(false)) so nothing can block it. */
  #s1 { position: absolute; left: 0; right: 0; top: 0; height: 66%; z-index: 2; }
  #s2 { position: absolute; left: 0; width: 52%; bottom: 0; height: 34%; z-index: 2; }
  #msg { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; color: #cfd6ea;
         font: 600 15px/1.5 system-ui, sans-serif; text-align: center; padding: 24px; z-index: 3; }
</style>
</head>
<body>
<!-- Used inside the Chatterbox app only: the app drives this player. -->
<div id="player"></div>
<div id="s1"></div><div id="s2"></div>
<div id="msg"></div>
<script>
  function send(o) {
    var s = JSON.stringify(o);
    try {
      if (window.chrome && window.chrome.webview) window.chrome.webview.postMessage(s);
      else if (window.CbxBridge) window.CbxBridge.postMessage(s);
    } catch (e) {}
  }
  function show(t) { var m = document.getElementById('msg'); m.textContent = t; m.style.display = 'flex'; }
  function hideMsg() { document.getElementById('msg').style.display = 'none'; }

  var params = new URLSearchParams(location.search);
  var vid = (params.get('v') || '').replace(/[^A-Za-z0-9_-]/g, '').slice(0, 11);
  var src = params.get('src') || '';
  var player = null, ready = false, el = null, mode = '';
  var interval = null;

  // ---------- one API for both kinds of video ----------
  window.cbx = {
    play: function () {
      if (!ready) return;
      if (mode === 'yt') player.playVideo(); else { var p = el.play(); if (p && p.catch) p.catch(function () {}); }
    },
    pause: function () { if (ready) { if (mode === 'yt') player.pauseVideo(); else el.pause(); } },
    seek: function (t) {
      if (!ready) return;
      t = Math.max(0, +t || 0);
      if (mode === 'yt') player.seekTo(t, true); else el.currentTime = t;
    },
    // a YouTube video by id
    load: function (id, t) {
      id = String(id || '').replace(/[^A-Za-z0-9_-]/g, '').slice(0, 11);
      if (!id) return;
      vid = id;
      hideMsg();
      if (mode === 'yt' && ready) {
        player.loadVideoById({ videoId: id, startSeconds: +t || 0 });
      } else if (mode === 'file') {
        // was a plain file: switch the page over to YouTube
        location.search = '?v=' + id;
      }
    },
    // a plain video file (mp4, webm...) by address
    loadSrc: function (url, t) {
      if (mode !== 'file') { location.search = '?src=' + encodeURIComponent(url); return; }
      hideMsg();
      el.src = url;
      el.currentTime = +t || 0;
      var p = el.play(); if (p && p.catch) p.catch(function () {});
    },
    // the shields only exist for YouTube
    shields: function (on) {
      document.getElementById('s1').style.display = on ? 'block' : 'none';
      document.getElementById('s2').style.display = on ? 'block' : 'none';
    },
    mute: function (m) {
      if (!ready) return;
      if (mode === 'yt') { m ? player.mute() : player.unMute(); } else el.muted = !!m;
    },
    state: function () {
      if (!ready) return;
      if (mode === 'yt') {
        send({ e: 'time', t: player.getCurrentTime(), d: player.getDuration(), s: player.getPlayerState(), v: vid });
      } else {
        var s = el.ended ? 0 : (el.paused ? 2 : (el.readyState < 3 ? 3 : 1));
        send({ e: 'time', t: el.currentTime || 0, d: isFinite(el.duration) ? el.duration : 0, s: s, v: src });
      }
    }
  };

  // ---------- a plain video file ----------
  function startFile() {
    mode = 'file';
    document.getElementById('s1').style.display = 'none';
    document.getElementById('s2').style.display = 'none';
    var holder = document.getElementById('player');
    el = document.createElement('video');
    el.setAttribute('playsinline', '');
    el.preload = 'auto';
    el.controls = false;            // the app has the controls
    el.style.pointerEvents = 'none'; // a click on the picture must not pause one side only
    holder.appendChild(el);
    el.addEventListener('loadedmetadata', function () {
      ready = true;
      send({ e: 'ready', d: isFinite(el.duration) ? el.duration : 0, v: src });
      if (!interval) interval = setInterval(window.cbx.state, 500);
    });
    el.addEventListener('ended', function () { send({ e: 'state', s: 0, t: el.currentTime, d: el.duration, v: src }); });
    el.addEventListener('error', function () {
      send({ e: 'error', c: el.error ? el.error.code : 0 });
      show('This video cannot be played. Check that the link opens a video file (mp4, webm).');
    });
    el.src = src;
  }

  // ---------- YouTube ----------
  window.onYouTubeIframeAPIReady = function () {
    if (!vid) { show('No video'); return; }
    mode = 'yt';
    player = new YT.Player('player', {
      videoId: vid,
      playerVars: { playsinline: 1, rel: 0, modestbranding: 1, controls: 0, disablekb: 1, fs: 0, iv_load_policy: 3, origin: location.origin },
      events: {
        onReady: function () {
          ready = true;
          send({ e: 'ready', d: player.getDuration(), v: vid });
          if (!interval) interval = setInterval(window.cbx.state, 500);
        },
        onStateChange: function (ev) {
          send({ e: 'state', s: ev.data, t: player.getCurrentTime(), d: player.getDuration(), v: vid });
        },
        onError: function (ev) {
          send({ e: 'error', c: ev.data });
          show(ev.data === 101 || ev.data === 150
            ? 'The owner of this video does not allow it to be played outside YouTube.'
            : 'This video cannot be played.');
        }
      }
    });
  };

  if (src) {
    startFile();
  } else {
    var s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api';
    document.body.appendChild(s);
  }
</script>
</body>
</html>
